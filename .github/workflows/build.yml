name: build

# golang.org/x/net is developed on Gerrit and tested by the Go project's own
# TryBots; the repository ships no GitHub Actions CI. This workflow reproduces
# the module source zip that proxy.golang.org publishes and runs the project's
# own suite (`go build ./...` / `go test ./...`) on the toolchain line declared
# by the `go` directive in go.mod.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Space-separated Go test names to run instead of the full suite"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          check-latest: true

      - name: Report toolchain
        run: go version

      # Produced FIRST, from the pristine checkout, so no build or test
      # byproduct can leak into the published file set. The helper module lives
      # under RUNNER_TEMP (outside GITHUB_WORKSPACE) so it stays out of the zip.
      - name: Create module zip
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zipper" "$RUNNER_TEMP/dist"
          cat > "$RUNNER_TEMP/zipper/create_mod.go" <<'EOF'
          package main

          import (
              "log"
              "os"

              "golang.org/x/mod/module"
              "golang.org/x/mod/zip"
          )

          // zip.CreateFromDir is Go's own module-zip implementation: it applies
          // the module proxy's inclusion rules, so .git, vendor and nested
          // modules are excluded and the file set matches the published zip.
          func main() {
              if len(os.Args) != 5 {
                  log.Fatal("usage: create_mod <module-path> <version> <source-dir> <output-zip>")
              }
              m := module.Version{Path: os.Args[1], Version: os.Args[2]}
              f, err := os.Create(os.Args[4])
              if err != nil {
                  log.Fatal(err)
              }
              defer f.Close()
              if err := zip.CreateFromDir(f, m, os.Args[3]); err != nil {
                  log.Fatal(err)
              }
              log.Printf("created module zip: %s", os.Args[4])
          }
          EOF
          # Zip a staging copy with .github/ stripped. Upstream x/net ships no
          # GitHub Actions CI, so that directory exists only to drive this build
          # and must not enter the published module file set.
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/src"
          rm -rf "$RUNNER_TEMP/src/.github"
          cd "$RUNNER_TEMP/zipper"
          go mod init example.com/zipper
          go get golang.org/x/mod@v0.28.0
          go run ./create_mod.go golang.org/x/net v0.45.0 "$RUNNER_TEMP/src" "$RUNNER_TEMP/dist/v0.45.0.zip"
          unzip -l "$RUNNER_TEMP/dist/v0.45.0.zip" | tail -2

      - name: Build
        run: go build ./...

      - name: Test
        env:
          TEST_FILTER: ${{ inputs.test-filter }}
        run: |
          set -euo pipefail
          if [ -n "$TEST_FILTER" ]; then
            go test -v -run "^($(echo "$TEST_FILTER" | tr ' ' '|'))$" ./... 2>&1 | tee "$RUNNER_TEMP/scoped.log"
            # go test exits 0 when -run matches nothing, so require every
            # selected test to have logged its own `=== RUN` line.
            for t in $TEST_FILTER; do
              grep -qE "^=== RUN[[:space:]]+${t}(/|$)" "$RUNNER_TEMP/scoped.log" || { echo "selected test $t never ran"; exit 1; }
            done
          else
            go test ./...
          fi

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/dist/v0.45.0.zip
          if-no-files-found: error
